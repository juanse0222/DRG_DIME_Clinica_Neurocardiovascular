# ── Netlify configuration — DIME Portal de Análisis ─────────────────────────
# Publish directory: docs/  (generated by Quarto)
# Auth: Netlify Identity (invite-only, @dime.com.co)

[build]
  publish = "docs"
  command = ""          # Static site — no build step needed

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "SAMEORIGIN"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"

# Netlify Identity callback redirect (required for the widget to work)
[[redirects]]
  from   = "/"
  to     = "/index.html"
  status = 200
